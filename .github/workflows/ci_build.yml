name: CI Build

on:
  # 仅手动触发：Actions → CI Build → Run workflow（分支选 main）
  workflow_dispatch:

jobs:
  build_app:
    runs-on: ubuntu-latest
    name: Build App
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-overwrite-existing: true

      - name: Check Signing Secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$KEY_STORE_PASSWORD" ] || [ -z "$ALIAS" ]; then
            echo "::error::缺少签名密钥：请在仓库 Settings → Secrets and variables → Actions 中添加 SIGNING_KEY、KEY_STORE_PASSWORD、ALIAS"
            exit 1
          fi
          if [ -z "$GIT_TOKEN" ]; then
            echo "::error::缺少 GIT_TOKEN：需要一个带 read:packages 权限的 GitHub 令牌，用于下载 GitHub Packages 上的依赖"
            exit 1
          fi

      - name: Create Sign File
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        run: |
          echo "$SIGNING_KEY" | base64 --decode > key.jks
          {
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_STORE_PASSWORD"
            echo "storeFile=../key.jks"
          } > signing.properties

      - name: Warm up JitPack (HyperFocusApi)
        # JitPack 会清理久未使用的旧构建产物，首次请求只会触发重新构建并返回 404，
        # 这里先轮询等它构建完成，避免 Gradle 一次请求就判定"找不到依赖"。
        continue-on-error: true
        run: |
          URL="https://jitpack.io/com/github/ghhccghk/HyperFocusApi/1.3/HyperFocusApi-1.3.pom"
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$URL")
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "::warning::JitPack 上的 HyperFocusApi:1.3 约 10 分钟内仍不可用，下面是 JitPack 的构建日志："
          curl -sL "https://jitpack.io/com/github/ghhccghk/HyperFocusApi/1.3/build.log" | tail -80 || true
          exit 1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (Canary)
        shell: bash
        env:
          GIT_ACTOR: ${{ github.actor }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: ./gradlew assembleCanary

      - name: Find APKs
        run: |
          APK_FILE=$(find app/build/outputs/apk/canary -name '*.apk')
          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
          echo "APK_FILE_NAME=$(basename $APK_FILE .apk)" >> $GITHUB_ENV

      - name: Show APKs SHA256
        if: success()
        run: |
          echo "### Build Success" >> $GITHUB_STEP_SUMMARY
          echo "|Artifact|SHA256|" >> $GITHUB_STEP_SUMMARY
          echo "|:---:|:---|" >> $GITHUB_STEP_SUMMARY
          APK_SHA256=($(sha256sum ${{ env.APK_FILE }}))
          echo "|Canary|$APK_SHA256" >> $GITHUB_STEP_SUMMARY

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILE_NAME }}
          path: ${{ env.APK_FILE }}
          compression-level: 9
